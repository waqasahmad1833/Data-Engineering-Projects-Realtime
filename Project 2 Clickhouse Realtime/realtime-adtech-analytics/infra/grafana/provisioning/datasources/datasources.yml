apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    isDefault: true
    editable: true
    jsonData:
      host: ch-s1-r1
      server: ch-s1-r1
      port: 9000
      protocol: native
      username: adtech
      defaultDatabase: adtech
    secureJsonData:
      password: ${CH_PASSWORD}

  - name: Prometheus
    type: prometheus
    uid: prometheus
    access: proxy
    url: http://prometheus:9090
    editable: true
