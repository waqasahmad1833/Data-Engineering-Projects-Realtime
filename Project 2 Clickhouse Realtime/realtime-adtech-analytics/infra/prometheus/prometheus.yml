global:
  scrape_interval: 15s
  evaluation_interval: 15s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: flink
    static_configs:
      - targets: ["flink-jobmanager:9249", "flink-taskmanager:9249"]

  - job_name: clickhouse
    static_configs:
      - targets: ["ch-s1-r1:9363", "ch-s1-r2:9363", "ch-s2-r1:9363", "ch-s2-r2:9363"]

  - job_name: kafka
    static_configs:
      - targets: ["kafka-exporter:9308"]
