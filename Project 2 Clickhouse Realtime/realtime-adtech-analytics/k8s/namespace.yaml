apiVersion: v1
kind: Namespace
metadata:
  name: adtech
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: clickhouse
  namespace: adtech
  annotations:
    # EKS example: IAM role with read/write access to the cold-storage bucket
    eks.amazonaws.com/role-arn: arn:aws:iam::CHANGE_ME:role/adtech-clickhouse-s3
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: flink
  namespace: adtech
  annotations:
    eks.amazonaws.com/role-arn: arn:aws:iam::CHANGE_ME:role/adtech-flink-s3
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: flink-edit
  namespace: adtech
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: edit
subjects:
  - kind: ServiceAccount
    name: flink
    namespace: adtech
