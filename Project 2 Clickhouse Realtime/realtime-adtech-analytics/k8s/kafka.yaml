# Strimzi Kafka in KRaft mode: 3 dedicated controllers, 6 brokers.
# ~1 TB/day raw JSON, zstd on the broker (~4-5x), 3 days retention, RF=3
#   -> ~0.7 TB compressed per day of retention x RF3 ~= 2 TB cluster-wide (+50% headroom).
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: controllers
  namespace: adtech
  labels:
    strimzi.io/cluster: adtech-kafka
spec:
  replicas: 3
  roles: [controller]
  storage:
    type: persistent-claim
    size: 50Gi
    deleteClaim: false
  resources:
    requests: {cpu: "1", memory: 4Gi}
    limits: {memory: 4Gi}
---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaNodePool
metadata:
  name: brokers
  namespace: adtech
  labels:
    strimzi.io/cluster: adtech-kafka
spec:
  replicas: 6
  roles: [broker]
  storage:
    type: jbod
    volumes:
      - id: 0
        type: persistent-claim
        size: 1Ti
        deleteClaim: false
  resources:
    requests: {cpu: "4", memory: 16Gi}
    limits: {memory: 16Gi}
  jvmOptions:
    -Xms: 6g
    -Xmx: 6g
---
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: adtech-kafka
  namespace: adtech
  annotations:
    strimzi.io/node-pools: enabled
    strimzi.io/kraft: enabled
spec:
  kafka:
    version: 3.7.0
    metadataVersion: 3.7-IV4
    listeners:
      - name: plain
        port: 9092
        type: internal
        tls: false
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      num.network.threads: 8
      num.io.threads: 16
      message.max.bytes: 10485760
      replica.fetch.max.bytes: 10485760
      log.segment.bytes: 1073741824
  entityOperator:
    topicOperator: {}
    userOperator: {}
