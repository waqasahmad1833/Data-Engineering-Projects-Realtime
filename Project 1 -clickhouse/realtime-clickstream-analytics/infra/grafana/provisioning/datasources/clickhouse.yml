apiVersion: 1

datasources:
  - name: ClickHouse
    type: grafana-clickhouse-datasource
    uid: clickhouse
    isDefault: true
    editable: true
    jsonData:
      host: clickhouse
      server: clickhouse
      port: 9000
      protocol: native
      username: ${CLICKHOUSE_USER}
      defaultDatabase: analytics
    secureJsonData:
      password: ${CLICKHOUSE_PASSWORD}
