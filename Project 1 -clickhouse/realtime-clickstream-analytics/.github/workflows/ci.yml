name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  flink-job:
    name: Flink job (Java)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "11"
          cache: maven
      - name: Build and test
        run: mvn -B -f flink-job/pom.xml verify

  producer:
    name: Producer (Python)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r producer/requirements-dev.txt
      - name: Run tests
        working-directory: producer
        run: pytest -q

  compose:
    name: Validate docker-compose
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose file
        run: cp .env.example .env && docker compose config -q
